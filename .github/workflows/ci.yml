name: ci

# The suite runs the whole workbench against an in-process fake of Colab — a
# stubbed CLI and a local SSH server — so it needs no Google account, no
# runtime allocation and no Python. That is what makes it a gate here rather
# than a thing you run when you happen to have a session.
#
# It runs on every platform the app ships to, not just the one that is cheap:
# a Windows-only path regression (or `windowsHide` going missing) has nowhere
# else to fail, and macOS is the platform no contributor here can run.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A fix pushed onto a branch makes the run before it irrelevant. On main the
# runs are kept: that is the history a release is cut from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # oxlint's correctness set (`.oxlintrc.json`). The three carve-outs in
      # that file are deliberate: Playwright's `async ({}, use)` fixtures, and
      # the two React Compiler advisories — refs written during render and
      # setState inside an effect — whose patterns this codebase uses on
      # purpose. `--deny-warnings` is not set, so a new rule that ships as a
      # warning informs without blocking.
      - name: Lint
        run: npm run lint

  test:
    strategy:
      # One platform failing must not cancel the others' answers.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Playwright only drives Electron here, and Electron is already a
      # dependency: downloading browsers would be pure cost.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron talks to a virtual display here, and the UI is Chinese: without
      # a CJK font every screenshot on a failed run would be boxes. The other
      # two runners have a desktop and a CJK font of their own.
      - name: Install the display and fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e

      - name: E2E (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run e2e

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per platform: one runner's failure must not overwrite another's.
          name: playwright-results-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
