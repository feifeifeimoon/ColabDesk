<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>ColabDesk</title><rect width="256" height="256" rx="57.6" fill="#171717"/><g transform="translate(43.39 43.39) scale(0.661)" fill="#ffffff">
  <title id="title">ColabDesk symbol — small-size cut</title>
